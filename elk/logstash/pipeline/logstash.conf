# Pipeline Logstash -- jbp-patient G8 + G14
#
# Flux : Filebeat --> [input beats:5044] --> [filter] --> [output elasticsearch]
#
# G14 : JsonTemplateLayout (EcsLayout.json) produit du JSON natif en ECS
# --> grok supprime : les champs ECS (@timestamp, log.level, log.logger, message...)
#     sont deja dans le JSON et indexes automatiquement par Elasticsearch
#
# AVANT G14 (PatternLayout) : grok etait obligatoire pour parser le texte
# APRES G14 (JsonTemplateLayout) : aucun parsing -- le JSON est lu tel quel

input {
  # Recoit les logs envoyes par Filebeat sur le port 5044
  beats {
    port => 5044
  }
}

filter {
  # G14 : champs ECS deja presents dans le JSON -- pas de grok necessaire
  # Si le message vient d'un conteneur Docker (non-JSON), on tente quand meme
  # le parsing JSON pour unifier le traitement ; json.add_error_key catchera l'echec

  # Ajoute un champ "application" pour filtrer dans Kibana
  mutate {
    add_field => { "application" => "jbp-patient" }
  }
}

output {
  # Envoie vers Elasticsearch -- index "jbp-patient-logs-YYYY.MM.DD" (rotation quotidienne)
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]   # nom de service Docker
    index => "jbp-patient-logs-%{+YYYY.MM.dd}"
  }

  # Affiche aussi dans les logs Logstash (debug -- commenter en prod)
  stdout {
    codec => rubydebug
  }
}
