# Pipeline Logstash -- jbp-patient G8
#
# Flux : Filebeat → [input beats:5044] → [filter] → [output elasticsearch]

input {
  # Reçoit les logs envoyés par Filebeat sur le port 5044
  beats {
    port => 5044
  }
}

filter {
  # Extrait les champs du message log4j2 de jbp-patient
  # Format log4j2 : "2026-08-14 10:23:45,123 INFO  PatientResource - GET /api/patients"
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+%{JAVACLASS:logger}\s+-\s+%{GREEDYDATA:log_message}"
    }
    tag_on_failure => ["_grok_failure"]   # tag si le pattern ne matche pas (log non structuré)
  }

  # Convertit le timestamp du log en champ date Elasticsearch
  date {
    match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss,SSS"]
    target => "@timestamp"
    tag_on_failure => ["_date_failure"]
  }

  # Ajoute un champ "application" pour filtrer dans Kibana
  mutate {
    add_field => { "application" => "jbp-patient" }
  }
}

output {
  # Envoie vers Elasticsearch -- index "jbp-patient-logs-YYYY.MM.DD" (rotation quotidienne)
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]   # nom de service Docker
    index => "jbp-patient-logs-%{+YYYY.MM.dd}"
  }

  # Affiche aussi dans les logs Logstash (debug -- commenter en prod)
  stdout {
    codec => rubydebug
  }
}
