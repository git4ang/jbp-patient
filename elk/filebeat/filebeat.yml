# Filebeat -- collecte des logs Docker pour jbp-patient G8
#
# type: container lit directement les fichiers de log Docker dans /var/lib/docker/containers/
# Pas d'autodiscover -- evite le bug API Docker 1.43 (C09/C23)

filebeat.inputs:
  # ① Logs des conteneurs Docker (G8)
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log   # tous les conteneurs Docker

  # ② Logs fichier local jbp-patient (G14 -- NDJSON ECS)
  # jbp-patient tourne hors Docker : Filebeat ne lit pas ses logs via type:container
  # json.keys_under_root : champs JSON au niveau racine de l'evenement Elasticsearch
  # json.add_error_key   : ajoute "error.message" si le parsing JSON echoue
  - type: log
    paths:
      - /logs/jbp-patient/jbp-patient.log   # monte depuis l'hote via volume docker-compose
    json.keys_under_root: true
    json.add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]    # nom de service Docker -- port Beats

# Niveau de log Filebeat (warning pour limiter le bruit)
logging.level: warning
logging.to_files: false
