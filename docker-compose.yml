#version: '3.8'

# Réseau interne pour que Jenkins puisse appeler les autres services par nom
networks:
  jbp-net:
    driver: bridge

services:

  # ─── Jenkins ──────────────────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jbp-jenkins
    networks:
      - jbp-net
    ports:
      - "8090:8080"    # UI Jenkins (8080 pris par jbp-patient)
      - "50500:50000"  # agents Jenkins distribues (50000 pris par IntelliJ IDEA)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker pour les builds
      - /opt/jdk-25:/opt/jdk-25:ro                 # JDK 25 hôte monte en lecture seule
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    restart: unless-stopped

  # ─── Gitea (remote Git local - optionnel, décommenter si pas de GitHub) ───
  # gitea:
  #   image: gitea/gitea:latest
  #   container_name: jbp-gitea
  #   networks:
  #     - jbp-net
  #   ports:
  #     - "3030:3000"   # UI Gitea
  #     - "2222:22"     # SSH Gitea
  #   volumes:
  #     - gitea_data:/data
  #   restart: unless-stopped

volumes:
  jenkins_home: {}
  # gitea_data: {}
