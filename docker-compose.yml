#version: '3.8'

# Réseau interne pour que Jenkins et SonarQube communiquent par nom de conteneur
# Jenkins appelle SonarQube via http://jbp-sonar:9000 (pas localhost)
networks:
  jbp-net:
    driver: bridge

services:

  # ─── Jenkins ──────────────────────────────────────────────────────────────
  jenkins:
    build:
      context: ./jenkins          # Dockerfile dans jenkins/ -- Docker CLI + Trivy inclus
    image: jbp-jenkins:custom     # nom de l'image buildée localement
    container_name: jbp-jenkins
    networks:
      - jbp-net
    ports:
      - "8090:8080"    # UI Jenkins (8080 pris par jbp-patient)
      - "50500:50000"  # agents Jenkins distribues (50000 pris par IntelliJ IDEA)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # acces Docker pour Testcontainers
      - /opt/jdk-25:/opt/jdk-25:ro                 # JDK 25 hôte monte en lecture seule
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    group_add:
      - "137"                              # groupe docker hote -- acces /var/run/docker.sock
    restart: unless-stopped

  # ─── SonarQube ────────────────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:community
    container_name: jbp-sonar
    networks:
      - jbp-net
    ports:
      - "9000:9000"    # UI SonarQube (admin/admin par defaut)
    volumes:
      - sonar_data:/opt/sonarqube/data   # projets, regles, historique analyses
      - sonar_logs:/opt/sonarqube/logs   # logs SonarQube
    environment:
      # Desactive les verifications kernel Elasticsearch (vm.max_map_count)
      # Obligatoire en environnement Docker de test sinon SonarQube refuse de demarrer
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    restart: unless-stopped

  # --- Nexus ----------------------------------------------------------------
  nexus:
    image: sonatype/nexus3:latest
    container_name: jbp-nexus
    networks: [ jbp-net ]
    ports:
      - "8081:8081"    # UI Nexus + repository Maven
      - "8082:8082"    # Docker registry (port dédié)
    volumes:
      - nexus_data:/nexus-data
    restart: unless-stopped

  # ─── ELK Stack ────────────────────────────────────────────────────────────

  # Elasticsearch : moteur de stockage et d'indexation des logs
  # xpack.security.enabled=false : pas d'auth pour l'apprentissage (HTTPS/auth en G11)
  # heap 512m : minimum viable -- augmenter si RAM disponible
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: jbp-elasticsearch
    networks:
      - jbp-net
    ports:
      - "9200:9200"    # API REST Elasticsearch (requetes, index, search)
    volumes:
      - es_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node          # mode standalone (pas de cluster)
      - xpack.security.enabled=false        # desactive auth/TLS pour le dev
      - ES_JAVA_OPTS=-Xms512m -Xmx512m     # heap limite (RAM contrainte : 1.8 Go dispo)
    restart: unless-stopped

  # Logstash : collecte, parse et route les logs vers Elasticsearch
  # heap 256m : minimum viable pour l'apprentissage
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: jbp-logstash
    networks:
      - jbp-net
    ports:
      - "5044:5044"    # port Beats -- Filebeat envoie ici
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro  # config pipeline
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m     # heap limite
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Kibana : UI de visualisation des logs indexés dans Elasticsearch
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: jbp-kibana
    networks:
      - jbp-net
    ports:
      - "5601:5601"    # UI Kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200  # nom de service Docker
      # Cle 32 chars obligatoire pour le module alerting (Rules)
      # Sans cette cle : "Additional setup required" et pas de bouton Create rule
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=jbppatient-kibana-encrypt-key-32c
      # Désactive le bandeau "Your data is not secure" -- coherent avec ES xpack.security=false
      - XPACK_SECURITY_ENABLED=false
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Filebeat : agent leger qui lit les logs Docker et les envoie a Logstash
  # Monte le socket Docker + les logs des conteneurs en lecture seule
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: jbp-filebeat
    networks:
      - jbp-net
    user: root                               # root requis pour lire /var/lib/docker/containers
    # --strict.perms=false : desactive la verification que filebeat.yml est owned by root
    # necessaire quand le fichier est monté depuis un hôte où il appartient à un user non-root
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      # C09/C23 : API Docker 1.43 trop ancienne -- force 1.44 comme pour Testcontainers
      - DOCKER_API_VERSION=1.44
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # data-root Docker non standard : /home/ang/wraptor/docker/ (voir /etc/docker/daemon.json)
      # chemin par defaut /var/lib/docker/containers n'existe pas sur cette machine
      - /home/ang/wraptor/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro               # metadata conteneurs
    depends_on:
      - logstash
    restart: unless-stopped

  # ─── G9 : Prometheus + Grafana ───────────────────────────────────────────

  # Prometheus : scrape /metrics de jbp-patient toutes les 15s, stocke les series temporelles
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: jbp-prometheus
    networks:
      - jbp-net
    ports:
      - "9090:9090"    # UI Prometheus (exploration des métriques brutes)
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # résout host.docker.internal vers l'hôte
    restart: unless-stopped

  # Grafana : dashboards visuels sur les métriques stockées dans Prometheus
  grafana:
    image: grafana/grafana:10.4.3
    container_name: jbp-grafana
    networks:
      - jbp-net
    ports:
      - "3000:3000"    # UI Grafana (admin/admin par défaut)
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # mot de passe admin Grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Gitea (remote Git local - optionnel, décommenter si pas de GitHub) ───
  # gitea:
  #   image: gitea/gitea:latest
  #   container_name: jbp-gitea
  #   networks:
  #     - jbp-net
  #   ports:
  #     - "3030:3000"   # UI Gitea
  #     - "2222:22"     # SSH Gitea
  #   volumes:
  #     - gitea_data:/data
  #   restart: unless-stopped

volumes:
  jenkins_home: {}
  sonar_data: {}
  sonar_logs: {}
  nexus_data: {}
  es_data: {}          # données Elasticsearch (index, logs)
  grafana_data: {}     # dashboards et datasources Grafana
  # gitea_data: {}
