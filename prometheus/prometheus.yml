# Configuration Prometheus -- jbp-patient G9
# Prometheus scrape /metrics toutes les 15s et stocke les series temporelles

global:
  scrape_interval: 15s      # frequence de collecte des metriques
  evaluation_interval: 15s  # frequence d'evaluation des regles d'alerte

scrape_configs:

  # jbp-patient : metriques JVM + compteurs HTTP custom
  # host.docker.internal : adresse de la machine hote depuis un conteneur Docker
  - job_name: 'jbp-patient'
    static_configs:
      - targets: ['host.docker.internal:8383']  # port 8383 expose par le conteneur jbp-patient
    metrics_path: '/api/metrics'
    # Pas d'auth car /metrics ne passe pas par BasicAuthFilter (filtre sur /api/patients uniquement)

  # Prometheus lui-meme -- permet de surveiller Prometheus dans Grafana
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
