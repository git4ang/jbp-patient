plugins {
    id 'java'
    id 'application'
    // Plugin SonarQube -- version compatible Gradle 9.x
    id 'org.sonarqube' version '7.3.1.8318'
    // JaCoCo -- mesure la couverture de tests, génère un rapport XML lu par SonarQube
    id 'jacoco'
    // OWASP Dependency Check -- scanne les CVE dans les dépendances
    id 'org.owasp.dependencycheck' version '10.0.4'

    id 'maven-publish'    // publie le JAR dans Nexus
}

group = 'fr.testlab.jbp'
version = project.findProperty('releaseVersion') ?: '2.0.0'  // local: 2.0.0 -- Jenkins: -PreleaseVersion=2.0.${BUILD_NUMBER}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    // mavenCentral()
    maven {
        url 'http://localhost:8081/repository/maven-public/'  // groupe Nexus = central + releases
        allowInsecureProtocol = true
        credentials {
            username = System.getenv('NEXUS_USER') ?: 'admin'
            password = System.getenv('NEXUS_PASS') ?: ''
        }
    }

}

// Publication du JAR vers Nexus
// URL et credentials lus depuis variables d'env -- jamais en dur
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java    // publie le JAR compilé
            groupId    = 'fr.testlab.jbp'
            artifactId = 'jbp-patient'
            version    = project.version   // '2.0.0' défini en haut
        }
    }
    repositories {
        maven {
            name = 'nexus'
            // URL du repo Nexus -- "releases" pour les versions stables
            allowInsecureProtocol = true  // Nexus HTTP local -- opt-in explicite requis par Gradle 7+
            url  = System.getenv('NEXUS_URL') ?: 'http://localhost:8081/repository/maven-releases/'
            credentials {
                // Credentials depuis variables d'env -- jamais hardcodés
                username = System.getenv('NEXUS_USER') ?: project.findProperty('nexusUser') ?: 'admin'
                password = System.getenv('NEXUS_PASS') ?: project.findProperty('nexusPass') ?: ''
            }
        }
    }
}


dependencies {
    // CXF 4.0.6 -- correctifs sécurité vs 4.0.5 (CVE-2025-23184, CVE-2025-48913...)
    implementation 'org.apache.cxf:cxf-rt-frontend-jaxrs:4.0.6'
    implementation 'org.apache.cxf:cxf-rt-transports-http-jetty:4.0.6'

    // Jakarta REST API 3.x (remplace javax.ws.rs)
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'

    // Jackson 2.17.2 -- correctifs sécurité vs 2.15.4 (CVE-2023-35116, CVE-2026-545xx...)
    implementation 'com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider:2.17.2'

    // SLF4J API -- facade de logging
    implementation 'org.slf4j:slf4j-api:2.0.13'

    // log4j2 2.24.3 -- correctifs sécurité vs 2.23.1 (CVE-2026-34477 RCE, CVE-2025-68161...)
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.3'

    // JUnit 5 (remplace JUnit 4)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // G10 : OTEL annotations -- @WithSpan sur les méthodes resource pour créer des spans
    // nécessaire car JAXRSAnnotationsInstrumentationModule est désactivé en mode programmatique
    // (JAXRSServerFactoryBean + Jetty embarqué ne passe pas par un servlet container)
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.9.0'

    // Prometheus Java client -- expose /metrics au format Prometheus
    implementation 'io.prometheus:simpleclient:0.16.0'
    implementation 'io.prometheus:simpleclient_hotspot:0.16.0'    // métriques JVM (heap, GC, threads)
    implementation 'io.prometheus:simpleclient_common:0.16.0'     // TextFormat -- sérialisation au format texte Prometheus

    // Testcontainers -- démarre un vrai PostgreSQL Docker pendant les tests
    testImplementation 'org.testcontainers:junit-jupiter:1.21.0'
    testImplementation 'org.testcontainers:postgresql:1.21.0'

    // Driver JDBC PostgreSQL -- connexion à PostgreSQL via DriverManager
    testImplementation 'org.postgresql:postgresql:42.7.3'
}

application {
    mainClass = 'fr.testlab.jbp.patient.app.JbpApplication'
}

test {
    useJUnitPlatform()

    // Fix C09 : api.version=1.44 force docker-java à utiliser l'API 1.44
    environment 'DOCKER_HOST', System.getenv('DOCKER_HOST') ?: 'unix:///var/run/docker.sock'
    systemProperty 'api.version', '1.44'

    // JaCoCo : active la collecte de couverture pendant l'exécution des tests
    finalizedBy jacocoTestReport
}

// JaCoCo : génère le rapport XML après les tests (lu par SonarQube)
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true   // SonarQube lit le XML (pas le HTML)
        html.required = true  // HTML utile pour consulter la couverture en local
    }
}

// SonarQube : indique où trouver le rapport JaCoCo
sonarqube {
    properties {
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
    }
}

// OWASP Dependency Check
dependencyCheck {
    failBuildOnCVSS = 7
    outputDirectory = 'build/reports/dependency-check'
    formats = ['HTML', 'XML']
    nvd.apiKey = System.getenv('NVD_API_KEY') ?: ''
    analyzers {
        // OSS Index (Sonatype) nécessite un compte -- désactivé (C14)
        ossIndex {
            enabled = false
        }
    }
}

tasks.withType(JavaCompile).configureEach {
//    options.compilerArgs += ['-nowarn']
}
