plugins {
    id 'java'
    id 'application'
}

group = 'fr.testlab.jbp'
version = '2.0.0'  // G6 : stack moderne

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    // CXF 4.x -- utilise jakarta.* (migration depuis javax.*)
    implementation 'org.apache.cxf:cxf-rt-frontend-jaxrs:4.0.5'
    implementation 'org.apache.cxf:cxf-rt-transports-http-jetty:4.0.5'

    // Jakarta REST API 3.x (remplace javax.ws.rs)
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'

    // Jackson avec module Jakarta (remplace jackson-jaxrs pour javax.*)
    implementation 'com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider:2.15.4'

    // SLF4J API -- facade de logging
    implementation 'org.slf4j:slf4j-api:2.0.13'

    // log4j2 -- implémentation SLF4J (remplace log4j 1.x EOL)
    implementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'

    // JUnit 5 (remplace JUnit 4)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers -- démarre un vrai PostgreSQL Docker pendant les tests
    // junit-jupiter : intégration avec @Testcontainers et @Container de JUnit 5
    // postgresql    : module qui sait démarrer l'image postgres:16
    testImplementation 'org.testcontainers:junit-jupiter:1.21.0'
    testImplementation 'org.testcontainers:postgresql:1.21.0'

    // Driver JDBC PostgreSQL -- connexion à PostgreSQL via DriverManager
    testImplementation 'org.postgresql:postgresql:42.7.3'
}

application {
    mainClass = 'fr.testlab.jbp.patient.app.JbpApplication'
}

test {
    useJUnitPlatform()  // active le moteur JUnit 5

    // Fix C09 : docker-java envoie GET /v1.32/info par défaut
    // Docker Engine 29.x impose MinAPIVersion=1.44 -> rejette avec HTTP 400
    // api.version=1.44 est la propriété système lue par DefaultDockerClientConfig
    // pour construire le pathPrefix de l'URL HTTP vers le socket Docker
    environment 'DOCKER_HOST', System.getenv('DOCKER_HOST') ?: 'unix:///var/run/docker.sock'
    systemProperty 'api.version', '1.44'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-nowarn']
}
