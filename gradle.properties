# Supprime les warnings "restricted method" de native-platform avec Java 25
# (System::load utilise par Gradle en interne -- pas lie au code du projet)
# Format correct pour Gradle 9.x + Java 25 : le flag doit etre dans les jvmargs du daemon
# et accompagne d'une valeur memoire (sinon Gradle peut l'ignorer)
org.gradle.jvmargs=-Xms64m -Xmx512m
org.gradle.java.home=/opt/jdk-25
#org.gradle.warning.mode=none